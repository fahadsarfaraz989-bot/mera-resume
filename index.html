
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marks Percentage Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="calculator">
        <h1>Marks Calculator</h1>

        <label>Total Marks</label>
        <input type="number" id="total" placeholder="Enter total marks">

        <label>Obtained Marks</label>
        <input type="number" id="obtained" placeholder="Enter obtained marks">

        <button onclick="calculatePercentage()">Calculate</button>

        <h2 id="result">Percentage: 0%</h2>
        <p id="message"></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
